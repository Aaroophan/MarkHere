name: Release Candidate Qualification
on:
  workflow_dispatch:
    inputs:
      channel:
        type: choice
        options: [beta, stable]
        default: beta
permissions:
  contents: read
jobs:
  qualify-windows-x64:
    runs-on: windows-2025
    env:
      MARKHERE_RELEASE_CHANNEL: ${{ inputs.channel }}
      MARKHERE_WINDOWS_PUBLISHER: ${{ secrets.MARKHERE_WINDOWS_PUBLISHER }}
      MARKHERE_UPDATE_BASE_URL: ${{ secrets.MARKHERE_UPDATE_BASE_URL }}
      CSC_LINK: ${{ secrets.MARKHERE_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.MARKHERE_CSC_KEY_PASSWORD }}
      MARKHERE_REFERENCE_PC: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.33.4, run_install: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22.16.0, cache: pnpm }
      - shell: pwsh
        run: if (-not (Test-Path pnpm-lock.yaml)) { throw 'pnpm-lock.yaml is required for release qualification' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm ci:foundation
      - run: pnpm test:conformance
      - run: pnpm build
      - run: pnpm test:e2e
      - run: pnpm test:performance
      - run: pnpm audit:dependencies
      - run: pnpm package:win:x64
      - run: pnpm release:verify-fuses -- dist/win-unpacked/markhere.exe
      - run: pnpm release:inspect-package -- dist/win-unpacked
      - if: inputs.channel == 'stable'
        run: pnpm release:verify-signatures -- dist
      - shell: pwsh
        run: |
          $installer=(Get-ChildItem dist -Filter '*setup.exe' | Select-Object -First 1).FullName
          if (-not $installer) { throw 'NSIS installer not found' }
          powershell -NoProfile -ExecutionPolicy Bypass -File tests/windows/system-acceptance.ps1 -Installer $installer
      - run: pnpm release:manifest -- dist
      - run: pnpm release:checksums -- dist
      - shell: pwsh
        run: |
          Copy-Item THIRD_PARTY_NOTICES.md dist/THIRD_PARTY_NOTICES.md
          if (Test-Path sbom.json) { Copy-Item sbom.json dist/sbom.json }
          $installer=(Get-ChildItem dist -Filter '*setup.exe' | Select-Object -First 1).FullName
          node scripts/create-release-evidence.mjs $installer dist/release-evidence.json
      - run: node scripts/generate-compatibility-report.mjs dist
      - run: pnpm check:release-acceptance
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-candidate-evidence-${{ github.sha }}
          path: |
            dist/
            test-results/
            tests/windows/manual-accessibility.md
            tests/windows/manual-interoperability.md
          if-no-files-found: error
